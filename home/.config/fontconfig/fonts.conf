<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Ringo - CJK font fallback ordering.

  noto-fonts (pkg.txt) only covers Latin/Greek/Cyrillic; the CJK faces come
  from noto-fonts-cjk.  Two things are configured here:

  1. Reachability.  Every generic family (sans-serif, serif, monospace) gets a
     Noto *CJK* family, so CJK codepoints that the theme fonts do not contain
     resolve to real glyphs instead of the blank boxes seen in the browser.

  2. Regional correctness.  Noto Sans/Serif CJK JP, SC, TC and KR declare the
     same language coverage and contain the same codepoints - they differ in
     the *glyph forms* of characters shared between the languages (直 骨 者 海
     譯 聲 ...).  The stock /etc/fonts/conf.d/65-nonlatin.conf only ever names
     the *KR* variant for the generic families, so without the rules below,
     Japanese and Chinese text ends up drawn with Korean forms.  Every block
     therefore tests the language of the text (`lang` contains ja / zh-cn /
     zh-tw / ko) and prefers the matching face.

  `prepend` + `binding="strong"` is used deliberately: it is what makes the
  regional face win over the KR-only preference shipped by 65-nonlatin.conf.
  Nothing here renames or removes a font, so the families configured elsewhere
  (Maple Mono NF in the shell, terminal and UI) keep their position
  and keep drawing every glyph they have; a CJK family only takes over for
  codepoints those families lack.
-->
<fontconfig>

  <!--
    Generic families, one block per language.
    e.g. Japanese text in a page whose CSS says "sans-serif" gets
    Noto Sans CJK JP; Chinese gets SC / TC; Korean gets KR.
  -->
  <!-- sans-serif -->
  <match target="pattern"><test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit></match>
  <match target="pattern"><test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit></match>
  <match target="pattern"><test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit></match>

  <!-- serif -->
  <match target="pattern"><test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit></match>
  <match target="pattern"><test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <match target="pattern"><test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK KR</string></edit></match>

  <!-- monospace -->
  <match target="pattern"><test name="family"><string>monospace</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK JP</string></edit></match>
  <match target="pattern"><test name="family"><string>monospace</string></test>
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>monospace</string></test>
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK TC</string></edit></match>
  <match target="pattern"><test name="family"><string>monospace</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK KR</string></edit></match>

  <!--
    Text that asks for a concrete family instead of a generic one, but does
    declare its language (a page whose CSS names "Arial, Helvetica", a Qt app
    with a CJK locale): the requested family stays first for Latin, and the
    regional CJK face is appended for kana/han/Hangul.  Weak binding, so it
    never displaces the family the text asked for.
  -->
  <match target="pattern"><test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK JP</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK TC</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK KR</string></edit></match>

  <!--
    Note: patterns that carry no language information at all keep the system
    behaviour of /etc/fonts/conf.d/65-nonlatin.conf, which offers a CJK font
    (the KR variant) as the generic fallback.  Glyphs are therefore never
    missing, but the form of the characters shared between the languages is
    only correct when the language is known: browsers derive it from the page
    (`lang` attribute, script) and pass it as FC_LANG, so text on the web gets
    the right regional face from the rules above.
  -->
</fontconfig>
