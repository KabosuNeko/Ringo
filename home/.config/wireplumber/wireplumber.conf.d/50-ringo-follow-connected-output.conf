# Let a newly connected output become the default sink.
#
# Why nothing moved before:
#   1. WirePlumber remembers every sink that was ever chosen as the default
#      (wpctl set-default / pactl set-default-sink / a volume applet) in
#      ~/.local/state/wireplumber/default-nodes and, with the upstream default
#      node.restore-default-targets = true, restores that choice on every start.
#      default-nodes/find-selected-default-node.lua then ranks the remembered
#      node at 30000 + priority.session, which beats every other node, and
#      find-best-default-node.lua gives up early above 15000. A remembered sink
#      therefore wins over anything that appears later, for good.
#      => stop remembering; a manual choice stays valid for the current session.
#
#   2. With the remembering off, the default is the available sink with the
#      highest priority.session (upstream docs: daemon/configuration/priorities.html).
#      Every output on this laptop ties at 1109, and a tie goes to the object
#      that appeared *first* -- so a freshly plugged device still lost. The
#      rules below say out loud what should win:
#
#        bluetooth headset (1500) > external output, e.g. the USB dongle (1200)
#        > built-in speakers (500)
#
#      The built-in speakers are the soldered ASUSTeK "C-Media(R) Audio" codec
#      (`removable = fixed` in sysfs); it is what is left when nothing is
#      connected, so it still takes over when a headset goes away.
#
# Not fixable here: the 3.5 mm jack of that codec exposes a single "Analog
# Output" port with `availability unknown` and only PCM/Mic mixer controls, so
# no jack or route change reaches PipeWire when headphones are plugged into it.
# Wired headphones that *appear* as a device (USB dongle, headset) are covered
# by the priority rules.

wireplumber.settings = {
  node.restore-default-targets = false
}

monitor.alsa.rules = [
  {
    # any ALSA output the user plugs in, e.g. the CX31993 USB dongle
    matches = [
      {
        node.name = "~alsa_output.usb-.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1200
      }
    }
  }
  {
    # ... except the soldered codec that drives the built-in speakers: keep it
    # below everything that can be connected. Must come after the rule above.
    # Scoped to outputs so that the built-in microphone keeps its own priority.
    matches = [
      {
        media.class = "Audio/Sink"
        node.nick = "C-Media(R) Audio"
      }
    ]
    actions = {
      update-props = {
        priority.session = 500
      }
    }
  }
]

monitor.bluez.rules = [
  {
    # connecting a bluetooth headset moves the output to it, even if an
    # external sink is already plugged in
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1500
      }
    }
  }
]
