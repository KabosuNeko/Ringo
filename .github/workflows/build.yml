name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: build IslandBackend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            build-essential \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            libpam0g-dev \
            libwayland-dev \
            wayland-protocols \
            stow

      - name: Configure
        run: cmake -S ringo-shell -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Installer end-to-end
        run: sh scripts/test-install.sh

  scripts:
    name: lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Parse install.sh
        run: sh -n install.sh

      - name: Shellcheck
        run: |
          # scratchpad.sh is Python behind a .sh name: lint only POSIX shebangs.
          # SC2086 on install.sh's intentionally word-split package list is fine.
          grep -lE '^#!.*\b(sh|bash|dash|ksh)\b' install.sh home/.local/bin/* scripts/*.sh \
            | xargs shellcheck --severity=warning

      - name: Docs are in sync
        run: |
          if [ -x scripts/gen-keybinds-doc.sh ]; then
            scripts/gen-keybinds-doc.sh --check
          fi

  config:
    name: QML syntax and config loader (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Quickshell
        run: pacman -Syu --noconfirm --needed quickshell

      - name: QML syntax
        # qmlformat only parses: no Quickshell types needed, and the same Qt as
        # the desktop (qmllint's category flags differ between Qt releases)
        run: |
          status=0
          for f in home/.config/ringo-shell/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$f" > /dev/null || { echo "syntax error: $f"; status=1; }
          done
          exit $status

      - name: JSONC load and serialized writes
        env:
          QT_QPA_PLATFORM: offscreen
        run: sh scripts/test-config-jsonc.sh
