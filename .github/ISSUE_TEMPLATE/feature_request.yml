name: Feature request
description: Suggest a change or an addition to the shell or the configuration.
title: "[feature] "
body:
  - type: markdown
    attributes:
      value: |
        Ringo aims to stay small and out of the way. Requests that add a
        background daemon, a polling loop, or a second tool for something the
        shell already does in-process are unlikely to land.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The workflow or annoyance behind the request.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        What you would like the shell to do, and where it would live: bar,
        control center, mini dashboard, an IPC command, or a `config.jsonc` key.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Existing keybinds, scripts or external tools that already cover part of
        this. Optional.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: niri and quickshell versions, plus hardware if it matters.
      placeholder: niri 25.05, quickshell 0.2.0, laptop with Intel iGPU
    validations:
      required: false
