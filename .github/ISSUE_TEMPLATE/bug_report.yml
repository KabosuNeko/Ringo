name: Bug report
description: Report something in the shell, the backend or the dotfiles that does not work as expected.
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Ringo targets Arch Linux, Niri and Wayland only. Fill in the versions
        below - without them a report usually cannot be reproduced.

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order. Include the keybind, command or action.
      placeholder: |
        1. Press Mod + Ctrl + C
        2. Pick a wallpaper from the switcher
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Paste error output verbatim.
    validations:
      required: true

  - type: input
    id: niri-version
    attributes:
      label: niri version
      description: Output of `niri --version`.
      placeholder: niri 25.05
    validations:
      required: true

  - type: input
    id: quickshell-version
    attributes:
      label: quickshell version
      description: Output of `quickshell --version` (or `qs --version`).
      placeholder: quickshell 0.2.0
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`ringo-shell call doctor check` output"
      description: |
        Paste the full report. It lists the state of the wallpaper and night
        light engines, the palette and state files, and every external tool the
        shell drives.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Shell logs
      description: |
        If the shell crashed or printed warnings, run it in the foreground
        (`ringo-shell`, or `qs -p ~/.config/ringo-shell`) and paste the output.
        Optional.
      render: text
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: |
        Any `~/.config/ringo-shell/config.jsonc` or `~/.config/niri/*.kdl` keys
        you changed that could matter. Optional.
      render: json
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I am running Arch Linux with Niri on Wayland.
          required: true
        - label: I rebuilt `IslandBackend` after pulling the latest changes, by rerunning `./install.sh`.
          required: false
